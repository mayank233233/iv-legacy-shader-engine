name: Windows x86 build

on:
  push:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up x86 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install legacy DirectX SDK containing FXC
        shell: pwsh
        run: |
          choco install directx-sdk --version=9.29.1962.02 --yes --no-progress --ignore-dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate FXC
        shell: pwsh
        run: |
          $fxc = Join-Path "${env:ProgramFiles(x86)}" "Microsoft DirectX SDK (June 2010)\Utilities\bin\x86\fxc.exe"
          if (-not (Test-Path $fxc)) { throw "FXC not found at expected DirectX SDK location: $fxc" }
          Write-Host "Using FXC: $fxc"
          Split-Path $fxc -Parent | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run source sanity checks
        shell: pwsh
        run: |
          python tests\check_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\check_asi_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\check_asi_log_analyzer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\check_asi_constants.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\analyze_d3d9_shaders.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\check_shader_analyzer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\audit_sm3_to_sm2.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\inspect_gtaiv_executable.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Shader Model 2.0 shaders
        shell: pwsh
        run: |
          cmd.exe /d /c build\compile_shaders.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inventory compiled SM2 shaders
        shell: pwsh
        run: |
          python tools\analyze_d3d9_shaders.py build\out --output build\out\shader_inventory.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = Get-Content build\out\shader_inventory.json -Raw | ConvertFrom-Json
          if ($inventory.parsed_shader_count -ne 6) { throw "Expected six parsed SM2 shaders; found $($inventory.parsed_shader_count)." }
          if ($inventory.failed_shader_count -ne 0) { throw 'One or more compiled SM2 shaders could not be parsed.' }
          if ($inventory.profile_counts.'vs_2_0' -ne 2 -or $inventory.profile_counts.'ps_2_0' -ne 4) { throw 'Unexpected SM2 shader profile inventory.' }

      - name: Build x86 D3D9 probe
        shell: pwsh
        run: |
          cmd.exe /d /c build\build_probe.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GTA IV x86 telemetry ASI
        shell: pwsh
        run: |
          cmd.exe /d /c build\build_asi.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build\bin\IVLegacyASI.asi)) { throw 'GTA IV telemetry ASI was not built.' }
          $asi = Get-Item build\bin\IVLegacyASI.asi
          if ($asi.Length -lt 4096) { throw "ASI output is unexpectedly small: $($asi.Length) bytes." }
          $bytes = [System.IO.File]::ReadAllBytes($asi.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'ASI output does not have a valid PE DOS header.' }
          if ($bytes.Length -lt 0x40) { throw 'ASI output is truncated.' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0x40 -or $peOffset + 6 -gt $bytes.Length) { throw 'ASI PE header offset is invalid.' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x14c) { throw ("Expected x86 PE machine 0x14c; found 0x{0:x}" -f $machine) }
          Write-Host "Verified x86 PE ASI: $($asi.Length) bytes"

      - name: Run D3D9 ASI hook runtime smoke test
        shell: pwsh
        run: |
          rc.exe /nologo /fo build\bin\test_gtaiv_version.res tests\test_gtaiv_version.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl.exe /nologo /EHsc /W4 /O2 /Fe:build\bin\GTAIV.exe tests\asi_runtime_smoke.cpp build\bin\test_gtaiv_version.res /link d3d9.lib user32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build\bin\GTAIV.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inventory captured runtime shader bytecode
        shell: pwsh
        run: |
          python tools\analyze_asi_log.py build\bin\IVLegacy.log --json build\bin\synthetic_draw_analysis.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $drawAnalysis = Get-Content build\bin\synthetic_draw_analysis.json -Raw | ConvertFrom-Json
          if ($drawAnalysis.draw_calls_observed -ne 4) { throw "Expected 4 synthetic draw calls; found $($drawAnalysis.draw_calls_observed)." }
          if ($drawAnalysis.texture_objects_observed -lt 1) { throw 'Expected texture creation/binding correlation in the synthetic log.' }
          if ($drawAnalysis.shader_fallback_usage.Count -lt 1) { throw 'Expected a source-to-PS2 fallback shader pair in the synthetic draw log.' }
          if ($drawAnalysis.draw_calls[0].sampler_state_count -lt 1 -or $drawAnalysis.draw_calls[0].render_state_count -lt 1 -or $drawAnalysis.draw_calls[0].texture_stage_state_count -lt 1) { throw 'Expected sampler, render-state and texture-stage fingerprints in the synthetic draw record.' }
          if ($drawAnalysis.vertex_declarations_observed -lt 1) { throw 'Expected synthetic vertex declaration capture.' }
          if (@($drawAnalysis.draw_calls[0].vertex_declaration.elements).Count -ne 2) { throw 'Expected two vertex declaration elements in the first draw.' }
          if (@($drawAnalysis.draw_calls[0].stream_bindings).Count -lt 1) { throw 'Expected stream source binding in the first draw.' }
          if ([string]::IsNullOrWhiteSpace($drawAnalysis.draw_calls[0].index_buffer_object)) { throw 'Expected index buffer binding in the first draw.' }
          if ($drawAnalysis.buffer_objects_observed -lt 2) { throw 'Expected vertex and index buffer creation descriptors.' }
          if ($drawAnalysis.draw_calls[0].stream_bindings[0].buffer_descriptor.length_bytes -ne 4096) { throw 'Expected 4096-byte synthetic vertex buffer descriptor.' }
          if ($drawAnalysis.draw_calls[0].index_buffer.length_bytes -ne 1024 -or $drawAnalysis.draw_calls[0].index_buffer.format -ne 101) { throw 'Expected 1024-byte INDEX16 synthetic index buffer descriptor.' }
          if ($drawAnalysis.draw_calls[1].fvf -eq 0) { throw 'Expected FVF state on the second draw after SetFVF.' }
          python tools\analyze_asi_constants.py build\bin\IVLegacyConstants --log build\bin\IVLegacy.log --json build\bin\shader_constant_inventory.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $constantInventory = Get-Content build\bin\shader_constant_inventory.json -Raw | ConvertFrom-Json
          if ($constantInventory.record_count -ne 6 -or $constantInventory.invalid_record_count -ne 0) { throw 'Expected six valid float/integer/boolean shader constant records.' }
          if ($constantInventory.shader_objects_resolved -ne 6) { throw 'Expected all six constant sidecars to resolve to shader objects/hashes.' }
          if (@($constantInventory.records | Where-Object { -not [string]::IsNullOrWhiteSpace($_.source_shader_hash) }).Count -lt 1) { throw 'Expected pixel constant sidecar to retain the original PS3 source shader hash.' }
          python tools\analyze_d3d9_shaders.py build\bin\IVLegacyCaptures --output build\bin\captured_shader_inventory.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $captured = Get-Content build\bin\captured_shader_inventory.json -Raw | ConvertFrom-Json
          if ($captured.parsed_shader_count -lt 2) { throw "Expected at least two captured runtime shaders; found $($captured.parsed_shader_count)." }
          if ($captured.failed_shader_count -ne 0) { throw 'One or more captured runtime shaders failed token parsing.' }
          if ($captured.profile_counts.'vs_2_0' -lt 1 -or $captured.profile_counts.'ps_2_0' -lt 1) { throw 'Expected both vertex and pixel SM2 captures.' }
          New-Item -ItemType Directory -Force build\bin\IVLegacyFallbacks | Out-Null
          python tools\audit_sm3_to_sm2.py build\bin\IVLegacyCaptures --emit-dir build\bin\IVLegacyFallbacks --fallback-ini build\bin\IVLegacyShaderFallbacks.ini --fallback-prefix IVLegacyFallbacks --report build\bin\captured_shader_downlevel_audit.json --max-samplers 16 --dependent-read-limit 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage build outputs with repository-relative paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact\build\out | Out-Null
          New-Item -ItemType Directory -Force artifact\build\bin | Out-Null
          Copy-Item build\out\*.vso artifact\build\out\
          Copy-Item build\out\*.pso artifact\build\out\
          Copy-Item build\out\*.asm artifact\build\out\
          Copy-Item build\out\shader_inventory.json artifact\build\out\
          Copy-Item build\bin\captured_shader_inventory.json artifact\build\bin\
          Copy-Item build\bin\captured_shader_downlevel_audit.json artifact\build\bin\
          Copy-Item build\bin\synthetic_draw_analysis.json artifact\build\bin\
          Copy-Item build\bin\IVLegacy.log artifact\build\bin\
          Copy-Item build\bin\shader_constant_inventory.json artifact\build\bin\
          Copy-Item build\bin\IVLegacyConstants artifact\build\bin\ -Recurse
          Copy-Item build\bin\IVLegacyCaptures artifact\build\bin\ -Recurse
          Copy-Item build\bin\IVLegacyShaderFallbacks.ini artifact\build\bin\
          Copy-Item build\bin\IVLegacyFallbacks artifact\build\bin\ -Recurse
          Copy-Item build\bin\D3D9ShaderProbe.exe artifact\build\bin\
          Copy-Item build\bin\IVLegacyASI.asi artifact\
          Copy-Item build\run_probe.bat artifact\build\
          if (-not (Test-Path artifact\build\bin\D3D9ShaderProbe.exe)) { throw 'Staged x86 probe executable is missing.' }
          if (-not (Test-Path artifact\IVLegacyASI.asi)) { throw 'Staged GTA IV telemetry ASI is missing.' }
          if (-not (Test-Path artifact\build\bin\IVLegacyConstants)) { throw 'Staged shader constant sidecars are missing.' }
          $constantFiles = @(Get-ChildItem artifact\build\bin\IVLegacyConstants -File -Filter '*.bin')
          if ($constantFiles.Count -ne 6) { throw "Expected 6 constant sidecars in staged artifact; found $($constantFiles.Count)." }
          $bytecode = @(Get-ChildItem artifact\build\out -File | Where-Object { $_.Extension -in @('.vso', '.pso') })
          if ($bytecode.Count -ne 6) { throw "Expected 6 shader bytecode files in staged artifact; found $($bytecode.Count)." }

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: iv-legacy-shader-engine-windows-x86
          path: artifact/
          if-no-files-found: error
