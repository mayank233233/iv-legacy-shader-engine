name: Windows x86 build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up x86 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install legacy DirectX SDK containing FXC
        shell: pwsh
        run: |
          choco install directx-sdk --version=9.29.1962.02 --yes --no-progress --ignore-dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate FXC
        shell: pwsh
        run: |
          $fxc = Join-Path "$env:ProgramFiles(x86)" "Microsoft DirectX SDK (June 2010)\Utilities\bin\x86\fxc.exe"
          if (-not (Test-Path $fxc)) { throw "FXC not found at expected DirectX SDK location: $fxc" }
          Write-Host "Using FXC: $fxc"
          Split-Path $fxc -Parent | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run source sanity checks
        shell: pwsh
        run: |
          python tests\check_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Shader Model 2.0 shaders
        shell: pwsh
        run: |
          cmd.exe /d /c build\compile_shaders.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x86 D3D9 probe
        shell: pwsh
        run: |
          cmd.exe /d /c build\build_probe.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: iv-legacy-shader-engine-windows-x86
          path: |
            build/out/*.vso
            build/out/*.pso
            build/out/*.asm
            build/bin/D3D9ShaderProbe.exe
          if-no-files-found: error
